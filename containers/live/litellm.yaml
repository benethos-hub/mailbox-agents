# The model gateway of the live setup: LiteLLM with one alias per backend.
# The agents name an alias in MAILBOX_AGENT_MODEL and never a model. There
# is no fallback from one alias to another: a key that reads mail must not
# reach a hosted model through a backend that was away (SPECS.md section 6).

# What every local model is called with. Unlike Claude, a local model takes
# a temperature, and on the CPU it takes its time.
x-gpu: &gpu
  api_base: http://llama-gpu:8080/v1
  api_key: none
  temperature: 0
  max_tokens: 2048
  timeout: 600
x-cpu: &cpu
  api_base: http://llama-cpu:8080/v1
  api_key: none
  temperature: 0
  max_tokens: 2048
  timeout: 600

model_list:
  # Claude through the Claude API, with the key in secrets/anthropic_api_key
  # or ANTHROPIC_API_KEY. Neither Haiku 5.5 nor Opus 5.5 takes a sampling
  # setting, so none is set. The agents use Haiku, chosen by the comparison
  # in README.md.
  - model_name: mail-classifier
    litellm_params: &haiku
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096

  # Each Claude model by its own name, for comparing them in evaluation runs.
  - model_name: claude/haiku-5-5
    litellm_params: *haiku
  - model_name: claude/opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096

  # The local model the agents use, on the card and on the CPU, chosen by
  # the comparison in README.md.
  - model_name: mail-classifier-gpu
    litellm_params: {<<: *gpu, model: openai/qwen3.6-35b-a3b}
  - model_name: mail-classifier-cpu
    litellm_params: {<<: *cpu, model: openai/qwen3.5-4b}

  # Every local model by its own name, for comparing them in evaluation
  # runs. The names are the sections of llama/presets-*.ini.
  - model_name: gpu/ministral-3-8b
    litellm_params: {<<: *gpu, model: openai/ministral-3-8b}
  - model_name: gpu/qwen3.5-9b
    litellm_params: {<<: *gpu, model: openai/qwen3.5-9b}
  - model_name: gpu/gemma-4-12b
    litellm_params: {<<: *gpu, model: openai/gemma-4-12b}
  - model_name: gpu/qwen3.6-35b-a3b
    litellm_params: {<<: *gpu, model: openai/qwen3.6-35b-a3b}
  - model_name: cpu/qwen3-4b-2507
    litellm_params: {<<: *cpu, model: openai/qwen3-4b-2507}
  - model_name: cpu/qwen3.5-4b
    litellm_params: {<<: *cpu, model: openai/qwen3.5-4b}
  - model_name: cpu/gemma-4-e4b
    litellm_params: {<<: *cpu, model: openai/gemma-4-e4b}
  - model_name: cpu/qwen3.6-35b-a3b
    litellm_params: {<<: *cpu, model: openai/qwen3.6-35b-a3b}

litellm_settings:
  # Mail content in the gateway's own log would undo what the agents keep
  # out of theirs.
  turn_off_message_logging: true
  drop_params: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # The database keeps the keys and what each spent, never a prompt or an
  # answer.
  store_prompts_in_spend_logs: false
